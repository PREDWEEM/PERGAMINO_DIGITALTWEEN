name: Mantener activo el gemelo Pergamino

on:
  schedule:
    # Cada cuatro horas, fuera del inicio de la hora (horario UTC).
    - cron: "11 */4 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/mantener_activo.yml
      - scripts/check_streamlit_app.py

permissions:
  contents: read

concurrency:
  group: mantener-activo-pergamino
  cancel-in-progress: false

jobs:
  visitar:
    if: github.repository == 'PREDWEEM/PERGAMINO_DIGITALTWEEN' && github.ref == 'refs/heads/main' && vars.PERGAMINO_APP_URL != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar navegador de comprobación
        run: |
          python -m pip install "playwright==1.58.0"
          python -m playwright install --with-deps chromium
      - name: Abrir y verificar el gemelo
        env:
          APP_URL: ${{ vars.PERGAMINO_APP_URL }}
        run: python scripts/check_streamlit_app.py
